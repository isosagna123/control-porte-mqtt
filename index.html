<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEST CONTROLE À DISTANCE ISMAILA</title>
    
    <style>
        /* Variables CSS pour les couleurs néon */
        :root {
            --neon-blue: #00e0ff;
            --dark-bg: #1a1a2e;
            --card-bg: #0f0f1d;
            --border-glow: rgba(0, 224, 255, 0.5);
            --text-color: #e0f7fa;
        }

        /* --- KEYFRAMES (Animations CSS) --- */
        
        /* Animation de Pulsation de fond (subtile) */
        @keyframes pulse-border {
            0% { border-color: var(--neon-blue); box-shadow: 0 0 10px var(--border-glow); }
            50% { border-color: rgba(0, 224, 255, 0.5); box-shadow: 0 0 15px var(--border-glow); }
            100% { border-color: var(--neon-blue); box-shadow: 0 0 10px var(--border-glow); }
        }

        /* Animation de Clignotement/Glitch (pour les changements d'état) */
        @keyframes glitch {
            0% { transform: translate(0, 0); opacity: 1; }
            5% { transform: translate(5px, 0); opacity: 0.8; }
            10% { transform: translate(-5px, 0); opacity: 1; }
            15% { transform: translate(0, 5px); opacity: 0.9; }
            20% { transform: translate(0, -5px); opacity: 1; }
            100% { transform: translate(0, 0); opacity: 1; }
        }

        /* Animation de Barre de Statut (connexion/déconnexion) */
        @keyframes loading-stripes {
            from { background-position: 0 0; }
            to { background-position: 40px 0; }
        }

        /* --- STYLES GÉNÉRAUX --- */

        body {
            font-family: 'Consolas', 'Courier New', monospace;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-shadow: 0 0 2px var(--neon-blue);
            
            /* --- STYLES D'IMAGE DE FOND --- */
            background-image: 
                /* Filtre sombre (overlay) pour assurer la lisibilité du texte néon */
                linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)), 
                /* L'image elle-même (doit être nommée background.jpg sur GitHub) */
                url('background.jpg');
            
            background-size: cover; /* Couvre tout l'écran */
            background-position: center; /* Centre l'image */
            background-attachment: fixed; /* Reste fixe au défilement */
            filter: blur(1px); /* Flou léger pour ne pas distraire */
        }
        
        .container {
            background: rgba(15, 15, 29, 0.85); /* Utilise une opacité réduite pour laisser l'image transparaître */
            padding: 40px;
            border-radius: 5px;
            box-shadow: 0 0 20px var(--neon-blue), 0 0 5px rgba(0, 0, 0, 0.5);
            border: 2px solid var(--neon-blue);
            text-align: center;
            max-width: 500px;
            width: 100%;
            
            /* Applique la pulsation sur le conteneur principal */
            animation: pulse-border 4s infinite alternate;

            /* Effet grille légère */
            background-image: linear-gradient(0deg, transparent 95%, rgba(0, 224, 255, 0.1) 100%), 
                              linear-gradient(90deg, transparent 95%, rgba(0, 224, 255, 0.1) 100%);
            background-size: 20px 20px;
            
            /* S'assure que le contenu est net */
            filter: none;
        }

        h1 {
            color: var(--neon-blue);
            margin-bottom: 30px;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding-bottom: 10px;
            border-bottom: 1px dashed var(--border-glow);
            animation: glitch 8s infinite steps(5); /* Glitch subtil sur le titre */
        }

        .status-group {
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid var(--neon-blue);
            border-radius: 0;
            box-shadow: 0 0 10px var(--border-glow) inset, 0 0 5px var(--border-glow);
            background-color: rgba(0, 0, 0, 0.3);
            text-align: left;
            overflow: hidden; /* Important pour l'animation de barre */
        }

        .status-group p {
            /* Utilisation de Flex pour aligner Étiquette/Valeur */
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
            font-size: 1rem;
            line-height: 1.4;
        }

        .status-label {
            font-weight: 400;
            color: var(--neon-blue);
            flex-shrink: 0;
            margin-right: 10px;
        }

        #mqtt-status, #door-status {
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 2px;
            display: inline-block;
            transition: all 0.1s ease;
            box-shadow: 0 0 5px currentColor;
            text-transform: uppercase;
            font-size: 1rem;
            flex-grow: 1; /* Permet à la valeur de statut de prendre le reste de l'espace */
            text-align: right;
        }

        /* --- ÉTATS ANIMÉS --- */

        .status-disconnected { 
            background-color: #a30000; 
            color: white; 
            box-shadow: 0 0 5px #ff0000;
            animation: glitch 1s infinite;
        }
        
        .status-connecting { 
            color: black; 
            background-color: #ffc107;
            background-image: linear-gradient(-45deg, rgba(255, 255, 255, .2) 25%, transparent 25%, transparent 50%, rgba(255, 255, 255, .2) 50%, rgba(255, 255, 255, .2) 75%, transparent 75%, transparent);
            background-size: 40px 40px;
            box-shadow: 0 0 5px #ffff00;
            animation: loading-stripes 1s linear infinite; 
        }

        .status-connected { 
            background-color: #00a300; 
            color: white; 
            box-shadow: 0 0 5px #00ff00;
        }

        .door-ouverte { background-color: #ff4d4d; color: white; box-shadow: 0 0 5px #ff4d4d; animation: glitch 0.5s 2; }
        .door-fermee { background-color: #4CAF50; color: white; box-shadow: 0 0 5px #4CAF50; animation: none; }
        .door-unknown { background-color: #a0aec0; color: black; box-shadow: 0 0 5px #a0aec0; }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 25px;
        }

        .action-btn {
            padding: 15px;
            font-size: 1rem;
            font-weight: 700;
            border: 1px solid var(--neon-blue);
            border-radius: 0;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            background-color: var(--card-bg);
            color: var(--neon-blue);
            box-shadow: 0 0 5px var(--border-glow);
        }

        .action-btn:hover {
            background-color: var(--neon-blue);
            color: var(--dark-bg);
            box-shadow: 0 0 20px var(--neon-blue);
        }
        
        .action-btn:active {
            transform: scale(0.95);
        }

        #open-btn { border-color: #f7931a; color: #f7931a; }
        #open-btn:hover { background-color: #f7931a; color: var(--dark-bg); box-shadow: 0 0 20px #f7931a; }

        #close-btn { border-color: #28a745; color: #28a745; }
        #close-btn:hover { background-color: #28a745; color: var(--dark-bg); box-shadow: 0 0 20px #28a745; }
        
        #stop-btn { border-color: #6c757d; color: #6c757d; }
        #stop-btn:hover { background-color: #6c757d; color: var(--dark-bg); box-shadow: 0 0 20px #6c757d; }


        .footer-info {
            margin-top: 30px;
            font-size: 0.8rem;
            color: var(--neon-blue);
            text-shadow: none;
            border-top: 1px dotted rgba(0, 224, 255, 0.2);
            padding-top: 15px;
        }

        /* --- RÉPONSIVITÉ (Optimisation pour mobile) --- */
        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }
            h1 {
                font-size: 1.3rem;
            }
            .action-btn {
                padding: 12px;
                font-size: 0.9rem;
            }
            /* Amélioration spécifique pour les petits écrans */
            .status-group p {
                flex-direction: column;
                align-items: flex-start;
            }
            .status-label {
                margin-bottom: 5px;
            }
            #mqtt-status, #door-status {
                width: 100%;
                text-align: center;
                margin-top: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>TEST CONTROLE À DISTANCE ISMAILA</h1>
        
        <div class="status-group">
            <p>
                <span class="status-label">[ MQTT STATUS ] :</span> 
                <span id="mqtt-status" class="status-disconnected">OFFLINE</span>
            </p>
            <p>
                <span class="status-label">[ ÉTAT PORTE ] :</span> 
                <span id="door-status" class="door-unknown">INITIALISATION</span>
            </p>
        </div>

        <div class="controls">
            <button id="open-btn" class="action-btn">OUVRIR ACCÈS (-60°)</button>
            
            <button id="close-btn" class="action-btn">VERROUILLER (+60°)</button>
            
            <button id="stop-btn" class="action-btn">NEUTRE (90°)</button>
        </div>
        
        <p class="footer-info">
            PROTOCOLE WSS SÉCURISÉ / ESP32 ACTIVE
        </p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    <script src="script.js"></script> 
</body>
</html>
